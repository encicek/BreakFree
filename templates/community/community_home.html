{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Topluluk</h1>
    <p>Gelişimini paylaş ve diğerlerini destekle.</p>

    <div class="mb-3">
        <a href="{% url 'community:create_post' %}" class="btn btn-primary">
            Post Oluştur
        </a>
        <!-- "Find Friends" butonu buradan kaldırıldı (İstek 2) -->
    </div>

    <!-- Postların geleceği konteyner -->
    <div id="post-container">
        {% include 'community/posts_list_partial.html' %}
    </div>
</div>

<!-- Otomatik Güncelleme Scripti (İstek 1) -->
<script>
    function fetchPosts() {
        fetch("{% url 'community:community_home' %}", {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.text())
        .then(html => {
            document.getElementById('post-container').innerHTML = html;
        })
        .catch(err => console.warn('Güncelleme sırasında hata oluştu:', err));
    }

    // Her 5 saniyede bir fetchPosts fonksiyonunu çalıştır (5000 milisaniye)
    setInterval(fetchPosts, 5000);
</script>
{% endblock %}
