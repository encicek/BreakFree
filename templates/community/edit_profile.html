{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0" style="border-radius: 20px;">
                <div class="card-body p-5">
                    <h3 class="fw-bold mb-4 text-center">Profilini Güncelle</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Döngü sayesinde forms.py'daki tüm alanlar (bio dahil) otomatik gelir -->
                        {% for field in form %}
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted text-uppercase">
                                    {{ field.label }}
                                </label>
                                
                                <!-- Django widget ayarlarını (rounded-pill, rows vb.) burada uygular -->
                                {{ field }}
                                
                                {% if field.help_text %}
                                    <div class="form-text small opacity-75">{{ field.help_text }}</div>
                                {% endif %}
                                
                                {% if field.errors %}
                                    <div class="text-danger small fw-bold mt-1">{{ field.errors }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                                Değişiklikleri Kaydet
                            </button>
                            <a href="{% url 'community:user_profile' username=request.user.username %}" class="btn btn-link text-muted text-decoration-none text-center">
                                Vazgeç
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
