{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-4"><i class="bi bi-key-fill text-success"></i> Parola Güncelle</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success rounded-pill fw-bold">Parolayı Güncelle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    input { width: 100%; border-radius: 20px; border: 1px solid #ddd; padding: 8px 15px; }
</style>
{% endblock %}
