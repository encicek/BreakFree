{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white p-4 text-center">
                    <h3 class="mb-0 text-capitalize">{{ type }} Bağımlılık Analizi</h3>
                    <p class="mb-0 opacity-75">Lütfen soruları dürüstçe yanıtlayın.</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        {% for q in questions %}
                            <div class="mb-4 pb-3 border-bottom">
                                <label class="form-label fw-bold d-block mb-3">
                                    {{ forloop.counter }}. {{ q.text }}
                                </label>
                                {% for val, label in q.choices %}
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ val }}" id="q_{{ q.id }}_{{ forloop.counter }}" required>
                                        <label class="form-check-label" for="q_{{ q.id }}_{{ forloop.counter }}">
                                            {{ label }}
                                        </label>
                                    </div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Analizi Tamamla</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
