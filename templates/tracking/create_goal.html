{% extends 'base.html' %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Yeni Bir Hedef Belirle</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">Kendine uygun bağımlılık türünü seç ve başlangıç skorunu girerek yeni ve temiz bir sayfa aç.</p>
                
                <form method="POST">
                    {% csrf_token %} 
                    
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-success w-100 mt-3 fw-bold">Hedefi Başlat</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
