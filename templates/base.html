<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakFree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="{% url 'tracking:dashboard' %}">
                BreakFree
            </a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tracking:dashboard' %}">Takip Paneli</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'community:community_home' %}">Topluluk</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'community:user_list' %}">Arkadaş Bul</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'community:user_profile' request.user.username %}">Profilim</a>
                        </li>
                        <li class="nav-item ms-lg-4">
                            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                                {% csrf_token %}
                                <button type="submit" class="nav-link text-danger fw-bold border-0 bg-transparent" style="cursor: pointer;">
                                    Çıkış Yap
                                </button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Giriş Yap</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'register' %}">Kayıt Ol</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
