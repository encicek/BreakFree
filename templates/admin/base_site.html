{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* 1. RENK AYARLARI */
    :root {
        --breakfree-green: #468c46 !important; /* Logondaki ana yeşil */
        --bg-white: #ffffff !important;
        --soft-green: #f0f7f0 !important;   /* Satır ve başlık arka planı */
    }

    body, #content, #content-main { 
        background-color: var(--bg-white) !important; 
        color: #333 !important; 
    }

    /* 2. ÜST BAR */
    #header { 
        background: var(--breakfree-green) !important; 
        padding: 12px 40px !important;
    }

    /* 3. GRUP BAŞLIKLARI (COMMUNITY, TRACKING vs.) */
    /* Beyaz üzerine açık yeşil şerit ve koyu yeşil yazı ile kontrastı düzelttik */
    .module h2, .module caption, .inline-group h2 { 
        background: var(--soft-green) !important; 
        color: var(--breakfree-green) !important; 
        font-weight: bold !important;
        border-bottom: 2px solid var(--breakfree-green) !important;
        text-transform: uppercase !important;
        padding: 10px !important;
    }

    /* 4. TABLO SATIRLARI */
    /* Siyahlıkları tamamen sildik, tertemiz beyaz/gri yaptık */
    .module table tbody tr, .module table tbody td, .module table tbody th {
        background-color: var(--bg-white) !important;
        color: #444 !important;
        border-bottom: 1px solid #eee !important;
    }

    .module table tbody tr:hover {
        background-color: #f9fdf9 !important; /* Hafif bir hover efekti */
    }

    /* Model İsimleri (Comments, Posts vs.) */
    .module table th a {
        color: var(--breakfree-green) !important;
        font-weight: 600 !important;
    }

    /* 5. BUTONLAR (EKLE / DEĞİŞTİR) */
    .addlink, .changelink {
        background-color: var(--breakfree-green) !important;
        color: white !important;
        border-radius: 6px !important;
        padding: 5px 12px !important;
        font-weight: bold !important;
        text-decoration: none !important;
    }

    /* 6. KARANLIK MODU ZORLA DEVRE DIŞI BIRAK */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, tr.row1, tr.row2, 
        .module table tbody tr, .module table tbody td { 
            background-color: var(--bg-white) !important; 
            color: #333 !important; 
        }
        .module h2 { background: var(--soft-green) !important; color: var(--breakfree-green) !important; }
        #header { background: var(--breakfree-green) !important; }
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
