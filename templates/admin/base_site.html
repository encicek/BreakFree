{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* --- BREAKFREE UNIFIED DESIGN SYSTEM --- */
    :root {
        --breakfree-green: #468c46 !important; 
        --bg-main: #f8f9fa !important;         
        --bg-card: #ffffff !important;         
        --text-dark: #333333 !important;
        --border-light: #d1d1d1 !important;
    }

    /* 1. TÜM SİYAHLIKLARI VE GÖLGELERİ SIFIRLA */
    body, #content, .module, #content-main, .change-form, 
    .submit-row, .paginator, #footer, #nav-sidebar { 
        background-color: var(--bg-main) !important; 
        color: var(--text-dark) !important; 
        box-shadow: none !important; /* Tüm gölgeleri sildik */
        border-color: var(--border-light) !important;
    }

    /* GÖRSELDEKİ O SİYAH ŞERİDİ KESİN OLARAK SİLME */
    #footer, .footer, #content-related::after, .module::after {
        display: none !important;
        background: none !important;
        box-shadow: none !important;
    }

    /* 2. ÜST BAR (HEADER) */
    #header { 
        background: var(--breakfree-green) !important; 
        color: white !important;
        padding: 15px 40px !important;
    }

    /* 3. GRUP BAŞLIKLARI (COMMUNITY, TRACKING vs.) */
    .module h2, .module caption, .inline-group h2, #content-related h2 { 
        background: var(--breakfree-green) !important; 
        color: #ffffff !important; 
        font-weight: 600 !important;
        text-transform: uppercase !important;
        padding: 12px 15px !important;
        border: none !important;
        border-radius: 4px 4px 0 0 !important;
    }

    /* 4. KART YAPISI VE TABLOLAR */
    .module, .form-row, .submit-row {
        background: var(--bg-card) !important;
        border: 1px solid var(--border-light) !important;
        border-radius: 6px !important;
        margin-bottom: 20px !important;
    }

    .module table tbody tr {
        background-color: var(--bg-card) !important;
        border-bottom: 1px solid #eeeeee !important;
    }

    .module table th a {
        color: var(--breakfree-green) !important;
        font-weight: 600 !important;
    }

    /* 5. EKLE/DEĞİŞTİR SAYFALARINDAKİ ALT BAR */
    .submit-row {
        background: var(--bg-card) !important;
        padding: 15px !important;
        display: flex !important;
        gap: 10px !important;
        flex-direction: row-reverse !important;
        border-radius: 6px !important;
    }

    .submit-row input, .submit-row input.default, .button, .default {
        background: var(--breakfree-green) !important;
        color: white !important;
        border: none !important;
        padding: 10px 20px !important;
        border-radius: 4px !important;
        text-transform: uppercase !important;
        font-weight: bold !important;
    }

    /* 6. DARK MODE TAMAMEN ETKİSİZ (GİRİŞ EKRANI RENGİ SABİT) */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, .form-row, .submit-row, #nav-sidebar { 
            background-color: var(--bg-main) !important; 
            color: var(--text-dark) !important; 
        }
        .module, .submit-row { background: var(--bg-card) !important; }
        #header, .module h2 { background: var(--breakfree-green) !important; color: white !important; }
        #footer, .footer { display: none !important; }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const headers = document.querySelectorAll('.module h2, .module caption, label, a');
        headers.forEach(el => {
            if (el.textContent.includes('TRACKİNG')) {
                el.textContent = el.textContent.replace('TRACKİNG', 'TRACKING');
            }
        });
    });
</script>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
