{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* --- SOFT MINT & PROFESSIONAL GREY THEME --- */
    :root {
        --deep-green: #2d5a27 !important;   /* Ana kurumsal yeşil */
        --mint-green: #468c46 !important;   /* Parlak detaylar */
        --soft-bg: #f0f2f0 !important;      /* Ekranın genel gri-yeşil tonu (BEYAZ DEĞİL) */
        --card-bg: #ffffff !important;      /* Kartların içi beyaz kalsın ki temiz görünsün */
        --border-green: #c2d6c2 !important; /* Belirgin çizgiler */
    }

    /* 1. GENEL ARKA PLAN */
    body, #content { 
        background-color: var(--soft-bg) !important; 
        color: #2c3e50 !important;
    }

    /* 2. ÜST BAR (DARK GREEN) */
    #header { 
        background: var(--deep-green) !important; 
        padding: 15px 40px !important;
        border-bottom: 4px solid var(--mint-green) !important;
    }

    /* 3. MODÜL KARTLARI (KUTULARI DAHA BELİRGİN YAPTIK) */
    .module {
        background: var(--card-bg) !important;
        border: 1px solid var(--border-green) !important;
        border-radius: 10px !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;
        margin-bottom: 30px !important;
        overflow: hidden !important;
    }

    /* GRUP BAŞLIKLARI (COMMUNITY, TRACKING vs.) */
    .module h2, .module caption, .inline-group h2 { 
        background: #e6eee6 !important; /* Başlıklar hafif renkli olsun */
        color: var(--deep-green) !important; 
        font-weight: 800 !important;
        font-size: 1rem !important;
        padding: 12px 18px !important;
        border-bottom: 2px solid var(--mint-green) !important;
        text-transform: uppercase !important;
    }

    /* 4. TABLO VE ÇİZGİLER (DAHA BELİRGİN) */
    .module table tbody tr {
        border-bottom: 1.5px solid #e0e0e0 !important; /* Çizgiler daha net */
    }

    .module table tbody tr:hover {
        background-color: #f7faf7 !important;
    }

    .module table td, .module table th {
        padding: 14px !important;
    }

    /* Model İsimleri */
    .module table th a {
        color: var(--deep-green) !important;
        font-weight: 600 !important;
    }

    /* 5. BUTONLAR (YEŞİL VE DOLGUN) */
    .addlink, .changelink {
        background-color: var(--mint-green) !important;
        color: white !important;
        border-radius: 5px !important;
        padding: 6px 15px !important;
        font-size: 0.8rem !important;
        font-weight: bold !important;
        text-transform: uppercase !important;
        transition: transform 0.2s !important;
    }

    .addlink:hover, .changelink:hover {
        background-color: var(--deep-green) !important;
        transform: translateY(-2px) !important;
    }

    /* 6. SAĞDAKİ SON EYLEMLER PANELİ */
    #content-related {
        background: #ffffff !important;
        border: 1px solid var(--border-green) !important;
        border-radius: 10px !important;
        margin-left: 20px !important;
    }

    /* 7. KARANLIK MODU ENGELLEME */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, .module table tbody tr { 
            background-color: var(--card-bg) !important; 
            color: #333 !important; 
        }
        #header { background: var(--deep-green) !important; }
        .module h2 { background: #e6eee6 !important; color: var(--deep-green) !important; }
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold; letter-spacing: 1px;">
        BREAKFREE <span style="font-weight: 300; opacity: 0.8;">| SİSTEM PANELİ</span>
    </a>
</h1>
{% endblock %}
