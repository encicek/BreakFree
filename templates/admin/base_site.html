{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* Django'nun renklerini zorla ezmek için !important kullanıyoruz */
    #header, .module h2, .module caption, .inline-group h2 { 
        background: #2c3e50 !important; 
        color: #f1c40f !important; 
    }
    div.breadcrumbs { background: #1a1a1a !important; }
    body { background-color: #121212 !important; color: #e0e0e0 !important; }
    .module { background: #1e1e1e !important; border: 1px solid #333 !important; }
    
    /* Bağlantı renkleri */
    a:link, a:visited { color: #3498db !important; }
    
    /* Sol menü ve tablolar */
    #nav-sidebar, .messagelist li { background: #1a1a1a !important; color: #eee !important; }
    table thead th { background: #252525 !important; color: #3498db !important; }
    tr.row1 { background: #161616 !important; }
    tr.row2 { background: #1c1c1c !important; }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: #f1c40f !important;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
