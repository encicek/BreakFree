{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* 1. TÜM ARKA PLANI BEYAZA ZORLA */
    :root {
        --primary: #468c46 !important; /* Logondaki yeşil tonu */
        --body-bg: #ffffff !important;
        --darker-bg: #f8f9fa !important;
    }

    body, #content, .module, #content-main, .dashboard .module table th { 
        background-color: #ffffff !important; 
        color: #333333 !important; 
    }

    /* 2. SİYAH KALAN MODÜL BAŞLIKLARINI VE KUTULARI DÜZELT */
    .module h2, .module caption, .inline-group h2 { 
        background: #eaf5ea !important; /* Çok açık yeşil */
        color: #468c46 !important; 
        border-bottom: 2px solid #468c46 !important;
    }

    /* Görseldeki o inatçı siyah satırları ve kutuları temizle */
    .module table tbody tr, .module table tbody td, .module table tbody th {
        background-color: #ffffff !important;
        color: #333333 !important;
        border-bottom: 1px solid #eee !important;
    }

    /* 3. SAĞDAKİ "SON EYLEMLER" PANELİ */
    #content-related {
        background: #fdfdfd !important;
        border-left: 1px solid #eee !important;
    }

    #content-related .module h2 {
        background: #468c46 !important;
        color: white !important;
    }

    /* 4. ÜST MENÜ (YEŞİL) */
    #header { 
        background: #468c46 !important; 
        color: white !important;
    }

    /* 5. BUTONLAR VE İKONLAR */
    .button, input[type=submit], .submit-row input, .addlink, .changelink {
        background-color: #468c46 !important;
        color: white !important;
        border-radius: 8px !important;
        padding: 5px 15px !important;
    }

    /* 6. KARANLIK MODU TAMAMEN DEVRE DIŞI BIRAK */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, #content-main, 
        .module table tbody tr, .module table tbody td {
            background-color: #ffffff !important;
            color: #333333 !important;
        }
        #header { background: #468c46 !important; }
        .module h2 { background: #eaf5ea !important; color: #468c46 !important; }
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
