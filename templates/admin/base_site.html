{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* --- BREAKFREE UNIFIED GREEN & WHITE DESIGN --- */
    :root {
        --breakfree-green: #468c46 !important; /* Giriş ekranındaki ana yeşilin */
        --bg-clean: #ffffff !important;
        --bg-soft-grey: #f8f9fa !important;
    }

    /* 1. TÜM SİYAHLIKLARI VE KOYU GRİLERİ YOK ET */
    body, #content, .module, #content-main, .change-form, 
    .submit-row, .paginator, #footer, #nav-sidebar { 
        background-color: var(--bg-clean) !important; 
        color: #333 !important; 
        box-shadow: none !important;
        border-color: #eee !important;
    }

    /* 2. ÜST BİLGİ VE NAVİGASYON (GİRİŞ EKRANIYLA AYNI) */
    #header { 
        background: var(--breakfree-green) !important; 
        color: white !important;
        padding: 15px 40px !important;
    }

    div.breadcrumbs {
        background: var(--bg-soft-grey) !important;
        color: var(--breakfree-green) !important;
        border-bottom: 1px solid #ddd !important;
        padding: 10px 40px !important;
    }
    div.breadcrumbs a { color: var(--breakfree-green) !important; font-weight: 600 !important; }

    /* 3. GRUP BAŞLIKLARI (COMMUNITY, TRACKING vs.) */
    .module h2, .module caption, .inline-group h2, #content-related h2 { 
        background: var(--breakfree-green) !important; 
        color: #ffffff !important; 
        font-weight: bold !important;
        text-transform: uppercase !important;
        padding: 12px 15px !important;
        border: none !important;
    }

    /* 4. FORM SATIRLARI (BEYAZ VE TEMİZ) */
    .form-row {
        background: var(--bg-clean) !important;
        border-bottom: 1px solid #eee !important;
        padding: 15px !important;
    }
    
    /* Form içindeki metin alanlarını siyahlıktan kurtar */
    textarea, input[type="text"], input[type="password"], select {
        background-color: #fff !important;
        color: #333 !important;
        border: 1px solid #ccc !important;
    }

    /* 5. GÖRSELDEKİ O SİYAH ALT BARI (SUBMIT ROW) DÜZELTME */
    .submit-row {
        background: var(--bg-soft-grey) !important; /* Siyah yerine açık gri/beyaz */
        border: 1px solid #ddd !important;
        border-radius: 8px !important;
        margin-top: 20px !important;
        padding: 15px !important;
    }

    /* KAYDET / SİL BUTONLARI (TAMAMEN YEŞİL) */
    .submit-row input, .submit-row input.default, .button, .default {
        background: var(--breakfree-green) !important;
        color: white !important;
        border: none !important;
        padding: 10px 20px !important;
        font-weight: bold !important;
        border-radius: 4px !important;
        text-transform: uppercase !important;
    }

    .submit-row a.deletelink {
        background: #ba2121 !important; /* Silme butonu kırmızı kalsın ama siyah olmasın */
        color: white !important;
        padding: 10px 20px !important;
        border-radius: 4px !important;
    }

    /* 6. KARANLIK MODU ZORLA DEVRE DIŞI BIRAK (RENDERING FIX) */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, .form-row, .submit-row, #nav-sidebar, 
        textarea, input, select { 
            background-color: var(--bg-clean) !important; 
            color: #333 !important; 
        }
        #header, .module h2 { background: var(--breakfree-green) !important; color: white !important; }
        .submit-row { background: var(--bg-soft-grey) !important; }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const headers = document.querySelectorAll('.module h2, .module caption, label, a');
        headers.forEach(el => {
            if (el.textContent.includes('TRACKİNG')) {
                el.textContent = el.textContent.replace('TRACKİNG', 'TRACKING');
            }
        });
    });
</script>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
