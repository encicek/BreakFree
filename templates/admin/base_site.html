{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* --- BREAKFREE UNIFIED GREEN & WHITE DESIGN --- */
    :root {
        --breakfree-green: #468c46 !important; /* Giriş ekranındaki ana yeşil */
        --bg-main: #f8f9fa !important;         /* Beyazı kıran hafif gri arka plan */
        --bg-card: #ffffff !important;         /* Kartların içi saf beyaz */
        --text-dark: #333333 !important;
        --border-light: #d1d1d1 !important;
    }

    /* 1. TÜM SİYAHLIKLARI VE ALT ŞERİTLERİ YOK ET */
    body, #content, .module, #content-main, .change-form, 
    .submit-row, .paginator, #footer, #nav-sidebar, .history-results { 
        background-color: var(--bg-main) !important; 
        color: var(--text-dark) !important; 
        box-shadow: none !important;
        border-color: var(--border-light) !important;
    }

    /* Görseldeki o inatçı alt siyahlığı hedef alıp yok ediyoruz */
    #content-related .module, .module table, .module {
        border-bottom: none !important;
    }
    
    div[style*="background-color: rgb(33, 37, 41)"], 
    .dark-mode-only, #footer {
        display: none !important;
    }

    /* 2. ÜST BİLGİ VE NAVİGASYON */
    #header { 
        background: var(--breakfree-green) !important; 
        color: white !important;
        padding: 15px 40px !important;
    }

    div.breadcrumbs {
        background: var(--bg-card) !important;
        color: var(--breakfree-green) !important;
        border-bottom: 1px solid var(--border-light) !important;
        padding: 10px 40px !important;
    }

    /* 3. BAŞLIKLAR (SON EYLEMLER VE DİĞERLERİYLE TAM UYUM) */
    .module h2, .module caption, .inline-group h2, #content-related h2 { 
        background: var(--breakfree-green) !important; 
        color: #ffffff !important; 
        font-weight: 600 !important;
        text-transform: uppercase !important;
        padding: 12px 15px !important;
        border: none !important;
        border-radius: 4px 4px 0 0 !important;
    }

    /* 4. KART YAPISI VE BELİRGİN ÇİZGİLER */
    .module, .submit-row {
        background: var(--bg-card) !important;
        border: 1px solid var(--border-light) !important;
        border-radius: 6px !important;
        margin-bottom: 25px !important;
    }

    .module table tbody tr td, .module table tbody tr th {
        border-bottom: 1px solid #eeeeee !important; /* Aralardaki çizgiler daha belirgin */
    }

    /* 5. EKLE/DEĞİŞTİR SAYFALARINDAKİ SİYAH ALANI BEYAZA ÇEVİR */
    .submit-row {
        background: var(--bg-card) !important;
        padding: 15px !important;
        display: flex !important;
        gap: 10px !important;
        flex-direction: row-reverse !important;
    }

    /* BUTONLAR (YEŞİL) */
    .submit-row input, .submit-row input.default, .button, .default {
        background: var(--breakfree-green) !important;
        color: white !important;
        border: none !important;
        border-radius: 4px !important;
        padding: 10px 20px !important;
        font-weight: bold !important;
        text-transform: uppercase !important;
    }

    /* 6. DARK MODE TAMAMEN ETKİSİZ */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, .form-row, .submit-row, #nav-sidebar { 
            background-color: var(--bg-main) !important; 
            color: var(--text-dark) !important; 
        }
        .module, .submit-row { background: var(--bg-card) !important; }
        #header, .module h2 { background: var(--breakfree-green) !important; }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // İsim düzeltmesi ve genel metin kontrolleri
        const elements = document.querySelectorAll('.module h2, .module caption, label, a');
        elements.forEach(el => {
            if (el.textContent.includes('TRACKİNG')) {
                el.textContent = el.textContent.replace('TRACKİNG', 'TRACKING');
            }
        });
    });
</script>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
