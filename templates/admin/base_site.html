{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
    /* --- BREAKFREE UNIFIED DESIGN SYSTEM --- */
    :root {
        --primary-green: #468c46 !important;
        --bg-soft: #f4f7f4 !important;
        --text-main: #333333 !important;
        --border-light: #d1d1d1 !important;
    }

    /* 1. GENEL ARKA PLAN VE FORM ALANLARI */
    body, #content, .change-form, .module, #content-main { 
        background-color: var(--bg-soft) !important; 
        color: var(--text-main) !important;
    }

    /* 2. ÜST BAR (HEADER & BREADCRUMBS) */
    #header { 
        background: var(--primary-green) !important; 
        padding: 12px 40px !important;
    }

    div.breadcrumbs {
        background: #ffffff !important;
        color: var(--primary-green) !important;
        border-bottom: 1px solid var(--border-light) !important;
        padding: 10px 40px !important;
    }

    div.breadcrumbs a { color: var(--primary-green) !important; font-weight: 600 !important; }

    /* 3. GRUP BAŞLIKLARI (COMMUNITY, TRACKING vs.) */
    .module h2, .module caption, .inline-group h2, #content-related h2 { 
        background: var(--primary-green) !important; 
        color: #ffffff !important; 
        font-weight: 600 !important;
        text-transform: uppercase !important;
        padding: 12px 15px !important;
        border-radius: 4px 4px 0 0 !important;
    }

    /* 4. FORM İÇİNDEKİ SİYAHLIKLARI VE ÇİZGİLERİ TEMİZLE */
    .form-row {
        background: #ffffff !important;
        border-bottom: 1px solid #eeeeee !important;
        padding: 15px !important;
    }

    label { color: #555555 !important; font-weight: 600 !important; }

    input, select, textarea {
        border: 1px solid var(--border-light) !important;
        border-radius: 4px !important;
        padding: 5px !important;
    }

    /* 5. ALT BUTON BARI (SUBMIT ROW) - O SİYAH ŞERİDİ YOK EDELİM */
    .submit-row {
        background: #ffffff !important; /* Siyah yerine beyaz */
        border: 1px solid var(--border-light) !important;
        border-radius: 6px !important;
        padding: 15px !important;
        margin-top: 20px !important;
    }

    /* KAYDET BUTONLARI */
    .submit-row input, .submit-row input.default {
        background: var(--primary-green) !important;
        color: white !important;
        border: none !important;
        border-radius: 4px !important;
        padding: 10px 20px !important;
        font-weight: bold !important;
        text-transform: uppercase !important;
        cursor: pointer !important;
    }

    .submit-row input:hover { opacity: 0.9 !important; }

    /* 6. SOLDAKİ NAVİGASYON (SİDEBAR) RENKLERİ */
    #nav-sidebar {
        background: #ffffff !important;
        border-right: 1px solid var(--border-light) !important;
    }

    #nav-sidebar .module th a { color: var(--primary-green) !important; }
    
    /* 7. DARK MODE ZORLAMASINI TAMAMEN SİL */
    @media (prefers-color-scheme: dark) {
        body, #content, .module, .form-row, .submit-row, #nav-sidebar { 
            background-color: var(--bg-soft) !important; 
            color: var(--text-main) !important; 
        }
        .form-row, .submit-row { background: #ffffff !important; }
        .module h2 { background: var(--primary-green) !important; color: white !important; }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const headers = document.querySelectorAll('.module h2, .module caption, label, a');
        headers.forEach(el => {
            if (el.textContent.includes('TRACKİNG')) {
                el.textContent = el.textContent.replace('TRACKİNG', 'TRACKING');
            }
        });
    });
</script>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: white !important; font-weight: bold;">
        BreakFree Yönetim Paneli
    </a>
</h1>
{% endblock %}
