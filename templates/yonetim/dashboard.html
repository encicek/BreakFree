<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakFree Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f4f6f9; }
        .admin-navbar { background-color: #212529; }
        .stat-card { transition: transform 0.2s ease-in-out; cursor: pointer; }
        .stat-card:hover { transform: translateY(-5px); }
        .text-decoration-none:hover .stat-card { box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar shadow-sm py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="{% url 'yonetim:dashboard' %}">
                <i class="bi bi-shield-lock-fill text-success me-2"></i>BreakFree YÖNETİM
            </a>
            
            <div class="d-flex align-items-center">
                <span class="text-light me-4 small">
                    <i class="bi bi-person-circle me-1"></i> Yetkili: <strong class="text-success">{{ request.user.username }}</strong>
                </span>
                <a href="/" class="btn btn-sm btn-outline-light rounded-pill px-3 me-2">
                    <i class="bi bi-house-door-fill me-1"></i> Siteye Dön
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h3 class="fw-bold mb-4 text-secondary">Sistem Özeti</h3>
        
        <div class="row g-4">
            <div class="col-md-4">
                <a href="{% url 'yonetim:user_list' %}" class="text-decoration-none">
                    <div class="card stat-card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4 d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-4">
                                <i class="bi bi-people-fill fs-1 text-primary"></i>
                            </div>
                            <div>
                                <h6 class="text-muted text-uppercase fw-bold mb-1 small">Kayıtlı Kullanıcı</h6>
                                <h2 class="fw-bold mb-0 text-dark">{{ total_users }}</h2>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="{% url 'yonetim:goal_list' %}" class="text-decoration-none">
                    <div class="card stat-card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4 d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded-circle me-4">
                                <i class="bi bi-bullseye fs-1 text-success"></i>
                            </div>
                            <div>
                                <h6 class="text-muted text-uppercase fw-bold mb-1 small">Açılan Hedefler</h6>
                                <h2 class="fw-bold mb-0 text-dark">{{ total_goals }}</h2>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="{% url 'yonetim:post_list' %}" class="text-decoration-none">
                    <div class="card stat-card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4 d-flex align-items-center">
                            <div class="bg-warning bg-opacity-10 p-3 rounded-circle me-4">
                                <i class="bi bi-chat-square-quote-fill fs-1 text-warning"></i>
                            </div>
                            <div>
                                <h6 class="text-muted text-uppercase fw-bold mb-1 small">Topluluk Postu</h6>
                                <h2 class="fw-bold mb-0 text-dark">{{ total_posts }}</h2>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
